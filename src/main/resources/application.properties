spring.application.name=trainingManager

# In-memory H2 database for easy local run
spring.datasource.url=jdbc:h2:mem:trainingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway disabled by default for H2 quickstart (enable when using PostgreSQL)
spring.flyway.enabled=false
